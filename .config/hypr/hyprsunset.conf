# ~/.config/hypr/hyprsunset.conf
max-gamma = 100

# Daytime profile (turns off tint starting at 6 AM)
profile {
    time = 06:00
    identity = true
    gamma = 1.0
}

# Evening profile (mild tint starting at 6 PM)
profile {
    time = 18:00
    temperature = 5000
    gamma = 1.0
}

# Night profile (heavier tint starting at 10 PM)
profile {
    time = 22:00
    temperature = 3500
    gamma = 0.9
}

