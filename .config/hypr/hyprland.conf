# Hyprland config by Danteloopz 

#  ==================== Monitors  ====================

monitor = DP-2, 1920x1080@165.00, 0x0, 1
monitor = DP-3, 1920x1080@165.00, 1920x-620, 1, transform, 3

workspace = 1, monitor:DP-2
workspace = 2, monitor:DP-2
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-2
workspace = 5, monitor:DP-2
workspace = 6, monitor:DP-3
workspace = 7, monitor:DP-3
workspace = 8, monitor:DP-3
workspace = 9, monitor:DP-3

#  ===================================================



# ==================== Hyprland Config Files ====================

source = ./binds.conf # Keybinds

#  ==============================================================


# ==================== Start Up Commands ====================

exec-once = hyprctl setcursor Bibata-Modern-Classic 24
exec-once = waybar
#exec-once = systemctl --user start hyprpolkitagent.service
exec-once = awww-daemon & sleep 0.1 && awww img ~/.config/hypr/wallpaper.png

#  ===========================================================




# ==================== Envoriment Variables ====================

ecosystem:no_update_news = true
ecosystem:enforce_permissions = false
env = NVD_BACKEND,direct
env = OZONE_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT, auto
env = XCURSOR_SIZE, 24
env = QT_QPA_PLATFORMTHEME, qt6ct 
env = QT_QPA_PLATFORM, wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
env = QT_STYLE_OVERRIDE, qt6ct
# env = WLR_NO_HARDWARE_CURSORS,1
env = XDG_SESSION_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_CURRENT_DESKTOP, Hyprland
env = HYPRSHOT_DIR, $HOME/Pictures/Screenshots
env = NIXOS_OZONE_WL, 1

# ==============================================================





# ==================== Permissions ==================== 

permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow

#  ====================================================




# ==================== Keyboard and Mouse ====================

input {
    kb_layout = pl
    kb_variant =
    kb_model =
    kb_options = caps:swapescape 
    kb_rules =

    follow_mouse = 1

    touchpad {    
        natural_scroll = no
    }

    sensitivity = -0.2 # -1.0 - 1.0, 0 means no modification.
}
# ======================================================== 




# ==================== Styling ====================

general {
    gaps_in = 2
    gaps_out = 5
    border_size = 2
    layout = dwindle

    allow_tearing = false
    hover_icon_on_border = true
    resize_on_border = false
}

decoration {
    rounding = 5
    active_opacity = 1
    inactive_opacity = 0.8
    
    blur {
        xray = true
        new_optimizations = true
        brightness = 1.01
    }

    shadow {
        enabled = false
        range = 0
    }

}
#  =================================================




# ==================== Animations ====================

animations {
    enabled = false
}
# ===================================================




# ==================== Layout ====================

#dwindle {
#    pseudotile = true
#    preserve_split = yes
#}
#  ================================================

# ========================================================= 



# ==================== Wallpaper ====================

misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false
    disable_splash_rendering = true
    font_family = "Monospace"
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    vrr = 0
}
# =====================================================




# ==================== Cursor Settings ====================

cursor {
    sync_gsettings_theme = true
    hide_on_touch = true
    enable_hyprcursor = true
    no_hardware_cursors = false
    hide_on_key_press = true
    warp_on_change_workspace = false
}
# =========================================================


# ==================== Theme ====================

source = ./theme.conf

#  ==============================================
debug:disable_logs = false
