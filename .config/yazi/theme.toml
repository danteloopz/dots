[theme]
background = "#333333"
foreground = "#C2C2C2"
border = "#5E5E5E"
highlight = "#5E5E5E"
accent = "#B8B8B8"
background-accent = "#333333"

[palette]
# ANSI colors
# The following colors are based on the provided palette.
# They are mapped to ANSI 0-15.
# `0` to `7` are the basic colors, and `8` to `15` are the bright colors.
0 = "#333333" # black
1 = "#CCCCCC" # red
2 = "#686868" # green
3 = "#7C7C7C" # yellow
4 = "#868686" # blue
5 = "#5E5E5E" # magenta
6 = "#B8B8B8" # cyan
7 = "#A4A4A4" # white
8 = "#A4A4A4" # bright black (gray)
9 = "#CCCCCC" # bright red
10 = "#686868" # bright green
11 = "#7C7C7C" # bright yellow
12 = "#868686" # bright blue
13 = "#5E5E5E" # bright magenta
14 = "#B8B8B8" # bright cyan
15 = "#868686" # bright white

[icon]
# Icon colors
# These are mapped to the provided palette to keep them grayscale.
dir = "#A4A4A4"
file = "#C2C2C2"
symlink = "#B8B8B8"
orphan = "#CCCCCC"
exec = "#7C7C7C"
block = "#868686"
char = "#B8B8B8"
fifo = "#CCCCCC"
socket = "#686868"
broken = "#CCCCCC"

# Popular file extensions
# Mapping common file types to the grayscale palette
video = "#686868"      # .mp4, .mkv, .webm, etc.
audio = "#5E5E5E"      # .mp3, .flac, .wav, etc.
image = "#A4A4A4"      # .jpg, .png, .gif, .svg, etc.
archive = "#7C7C7C"    # .zip, .tar, .gz, .rar, etc. <-- This is the correct line.
document = "#B8B8B8"   # .pdf, .doc, .docx, .odt, etc.
text = "#C2C2C2"       # .txt, .md, .log, etc.
code = "#868686"       # .rs, .c, .cpp, .js, .py, .go, etc.
web = "#B8B8B8"        # .html, .css, .scss, etc.
script = "#7C7C7C"     # .sh, .zsh, .bash, etc.
config = "#5E5E5E"     # .conf, .json, .toml, .yaml, etc.
font = "#A4A4A4"       # .ttf, .otf, .woff, etc.
database = "#686868"   # .sql, .db, .sqlite, etc.
data = "#C2C2C2"       # .json, .csv, .xml, etc.
presentation = "#868686" # .ppt, .pptx, etc.
spreadsheet = "#686868" # .xls, .xlsx, .csv, etc.
disk = "#B8B8B8"       # .iso, .img, .dmg, etc.
vm = "#5E5E5E"         # .vdi, .vmdk, etc.
key = "#A4A4A4"        # .pem, .key, .pub, etc.
lock = "#868686"       # .lock, .lk, etc.
makefile = "#B8B8B8"   # Makefile, makefile
docker = "#686868"     # Dockerfile
git = "#7C7C7C"        # .gitignore, .gitmodules
bin = "#7C7C7C"        # .bin
desktop = "#A4A4A4"    # .desktop
service = "#686868"    # .service
