  { name = "*.woff", fg = "#A4A4A4" },
  
  { name = "*.sql", fg = "#686868" },
  { name = "*.db", fg = "#686868" },
  { name = "*.sqlite", fg = "#686868" },
  
  { name = "*.csv", fg = "#C2C2C2" },
