[manager]
# Core UI panel colors
cwd = { fg = "#B8B8B8" }

# Hovered item styling
hovered = { fg = "#333333", bg = "#5E5E5E" }

# Selected items styling
preview = { fg = "#C2C2C2", bg = "#333333", border = "#5E5E5E" }

[palette]
0 = "#333333" 
1 = "#CCCCCC" 
2 = "#686868" 
3 = "#7C7C7C" 
4 = "#868686" 
5 = "#5E5E5E" 
6 = "#B8B8B8" 
7 = "#A4A4A4" 
8 = "#A4A4A4" 
9 = "#CCCCCC" 
10 = "#686868" 
11 = "#7C7C7C" 
12 = "#868686" 
13 = "#5E5E5E" 
14 = "#B8B8B8" 
15 = "#868686" 

[icon]
# Core types
dir = "#A4A4A4"
file = "#C2C2C2"
symlink = "#B8B8B8"
orphan = "#CCCCCC"
exec = "#7C7C7C"
block = "#868686"
char = "#B8B8B8"
fifo = "#CCCCCC"
socket = "#686868"
broken = "#CCCCCC"

# Rules for categories and extensions
rules = [
  # Categories
  { name = "*", is = "dir", fg = "#A4A4A4" },
  { name = "*", is = "exec", fg = "#7C7C7C" },
  
  # File Extension Mappings
  { name = "*.mp4", fg = "#686868" },
  { name = "*.mkv", fg = "#686868" },
  { name = "*.webm", fg = "#686868" },
  
  { name = "*.mp3", fg = "#5E5E5E" },
  { name = "*.flac", fg = "#5E5E5E" },
  { name = "*.wav", fg = "#5E5E5E" },
  
  { name = "*.jpg", fg = "#A4A4A4" },
  { name = "*.png", fg = "#A4A4A4" },
  { name = "*.gif", fg = "#A4A4A4" },
  { name = "*.svg", fg = "#A4A4A4" },
  
  { name = "*.zip", fg = "#7C7C7C" },
  { name = "*.tar", fg = "#7C7C7C" },
  { name = "*.gz", fg = "#7C7C7C" },
  { name = "*.rar", fg = "#7C7C7C" },
  
  { name = "*.pdf", fg = "#B8B8B8" },
  { name = "*.doc", fg = "#B8B8B8" },
  { name = "*.docx", fg = "#B8B8B8" },
  { name = "*.odt", fg = "#B8B8B8" },
  
  { name = "*.txt", fg = "#C2C2C2" },
  { name = "*.md", fg = "#C2C2C2" },
  { name = "*.log", fg = "#C2C2C2" },
  
  { name = "*.rs", fg = "#868686" },
  { name = "*.c", fg = "#868686" },
  { name = "*.cpp", fg = "#868686" },
  { name = "*.js", fg = "#868686" },
  { name = "*.py", fg = "#868686" },
  { name = "*.go", fg = "#868686" },
  
  { name = "*.html", fg = "#B8B8B8" },
  { name = "*.css", fg = "#B8B8B8" },
  { name = "*.scss", fg = "#B8B8B8" },
  
  { name = "*.sh", fg = "#7C7C7C" },
  { name = "*.zsh", fg = "#7C7C7C" },
  { name = "*.bash", fg = "#7C7C7C" },
  
