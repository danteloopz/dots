  { name = "Makefile", fg = "#B8B8B8" },
  { name = "makefile", fg = "#B8B8B8" },
  { name = "Dockerfile", fg = "#686868" },
  
  { name = ".gitignore", fg = "#7C7C7C" },
  { name = ".gitmodules", fg = "#7C7C7C" },
  
  { name = "*.bin", fg = "#7C7C7C" },
